<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Geist+Mono:wght@500&family=Sora:wght@700&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 627px; background: #0f1110; }
  .frame {
    position: absolute; inset: 28px; padding: 52px 60px 44px;
    display: flex; flex-direction: column;
    border: 1px solid #2b302e;
    box-shadow: inset 0 0 0 4px #0f1110, inset 0 0 0 5px #2b302e;
    color: #e9eeec; font-family: "Geist", sans-serif;
  }
  .eyebrow { font: 500 19px "Geist Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: #9aa4a0; }
  .title { margin-top: 28px; font: 700 ${title_size}px/1.02 "Sora", sans-serif; letter-spacing: -.02em; text-transform: uppercase; color: #fff; }
  .claim { margin-top: 26px; font: 500 34px/1.3 "Geist", sans-serif; }
  .claim b { font-weight: 500; color: #0defc8; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .lockup img { height: 36px; }
  .lockup i { width: 1px; height: 28px; background: #4a524f; }
  .lockup span { font: 500 19px "Geist Mono", monospace; letter-spacing: .12em; color: #fff; }
  .url { font: 500 18px "Geist Mono", monospace; color: #9aa4a0; }
</style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">$eyebrow</div>
    <div class="title">$title</div>
    <div class="claim">$claim</div>
    <div class="foot">
      <div class="lockup"><img src="$logo" alt=""><i></i><span>PLATFORM</span></div>
      <div class="url">$url</div>
    </div>
  </div>
</body>
</html>
